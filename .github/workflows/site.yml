# Publica a versão pública do painel no GitHub Pages (abre sem login, para qualquer pessoa).
# Roda quando o site ou os dados mudam, e também no fim da atualização mensal.
name: publicar-site
on:
  push:
    branches: [main]
    paths: ["site/**", "saidas/painel/json/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Montar o site com os dados mais recentes
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp saidas/painel/json/*.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
